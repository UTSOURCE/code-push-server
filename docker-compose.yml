version: '3.7'
services:
  server:
    image: shmopen/code-push-server:latest
    platform: linux/arm64
    volumes:
      - /home/node/code-push-server/data/storage:/data/storage
      - /home/node/code-push-server/data/tmp:/data/tmp
    environment:
      DOWNLOAD_URL: 'http://132.226.239.165:3000/download'
      TOKEN_SECRET: 'REPLACE_WITH_63_CHAR_RANDOM_TOKEN'
      RDS_HOST: 'mysql'
      RDS_USERNAME: 'codepush'
      RDS_PASSWORD: 'CHANGE_ME_DB_PASSWORD'
      RDS_DATABASE: 'codepush'
      STORAGE_DIR: '/data/storage'
      DATA_DIR: '/data/tmp'
      NODE_ENV: 'production'
      REDIS_HOST: 'redis'
    ports:
      - '3000:3000'
    depends_on:
      - mysql
      - redis
  mysql:
    image: mysql:latest
    volumes:
      - /home/node/code-push-server/data/mysql:/var/lib/mysql
      - ./sql/codepush-all-docker.sql:/docker-entrypoint-initdb.d/codepush-all.sql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'On'
  redis:
    image: redis:latest
    volumes:
      - /home/node/code-push-server/data/redis:/data
